<!doctype html>
<!--
THESIS: Grant work as a box of matches. Each grant is a matchbox label; each open question is a
match you strike (answer), put back (later), or settle (decide). Refuses the category default: an
issue list or kanban rows you scroll and read.
OWN-WORLD: South Asian matchbox-label print on a deep indigo tray: flat spot inks (vermilion, turmeric,
leaf, peacock, magenta, ultramarine, ochre), double-ruled frames, slab wood-type caps, a paper
cartouche for the question, a stamped due-date, slight misregistration.
STORY: The founder opens it in a spare minute, sees the most urgent grant's label, strikes two or three
matches by voice, watches the box empty and the flame keep going, and closes it knowing what's sent.
FIRST VIEWPORT: flame streak + today's struck matches across the top; one label filling about 70% of
the screen (funder, due stamp, question); Later / Strike buttons and the mic under the thumb.
FORM: card-stack swipe, grounded candidate #7, seed 664224fa; staging: one label at a time on the tray.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14143a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Matchbox">
<title>Matchbox · Lotus grants</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<main id="app" aria-live="polite">
  <div class="boot">Opening the box…</div>
</main>
<div id="sheet" class="sheet" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>
<script src="app.js" defer></script>
</body>
</html>
